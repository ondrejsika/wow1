{{define "task_edit"}}
<li id="task-{{.Task.ID}}" class="task-row editing">
  <form hx-put="/tasks/{{.Task.ID}}" hx-target="#task-{{.Task.ID}}" hx-swap="outerHTML">
    <input type="text" name="title" value="{{.Task.Title}}" maxlength="200" autofocus>
    <button type="submit">Save</button>
    <button type="button" hx-get="/tasks/{{.Task.ID}}" hx-target="#task-{{.Task.ID}}" hx-swap="outerHTML">Cancel</button>
    {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
  </form>
</li>
{{end}}
