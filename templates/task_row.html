{{define "task_row"}}
<li id="task-{{.Task.ID}}" class="task-row{{if .Task.Done}} done{{end}}">
  <input type="checkbox" class="toggle" hx-post="/tasks/{{.Task.ID}}/toggle" hx-target="#task-{{.Task.ID}}" hx-swap="outerHTML" hx-trigger="change" {{if .Task.Done}}checked{{end}}>
  <span class="title">{{.Task.Title}}</span>
  <span class="actions">
    {{if not .Task.Done}}
    <button type="button" class="edit" hx-get="/tasks/{{.Task.ID}}/edit" hx-target="#task-{{.Task.ID}}" hx-swap="outerHTML">Edit</button>
    {{end}}
    <button type="button" class="delete" hx-delete="/tasks/{{.Task.ID}}" hx-target="#task-{{.Task.ID}}" hx-swap="outerHTML" hx-confirm="Delete this task?">Delete</button>
  </span>
  {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
</li>
{{end}}
